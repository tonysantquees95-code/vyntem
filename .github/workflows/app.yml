name: App (interface, Windows e APK)

# Verifica a interface, gera o instalador do Windows (Tauri) e o APK do Android (Capacitor + plugin Java).
# Cada versão boa vira uma release "1.N" com VyntemSetup.exe e Vyntem.apk.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Chave pública do selo de licença (embutida no aplicativo)
        run: |
          x=$(curl -fsS --retry 5 --retry-delay 5 https://venus-servidor.tonysantquees95.workers.dev/id/chave-publica | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!/^[A-Za-z0-9_-]{43}$/.test(j.x))process.exit(1);console.log(j.x)})')
          echo "VITE_SELO_CHAVE=$x" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: app
      - run: npm run test && npm run typecheck && npm run build
        working-directory: app
        env:
          VITE_BUILD: ${{ github.run_number }}
      - name: Teste visual (telas em vários tamanhos)
        run: npm run test:visual
        working-directory: app
        env:
          CHROME: C:/Program Files/Google/Chrome/Application/chrome.exe
      - name: Guardar as fotos das telas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fotos-das-telas
          path: app/teste-visual/fotos/
          retention-days: 7

  windows:
    needs: verificar
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Chave pública do selo de licença (embutida no aplicativo)
        run: |
          x=$(curl -fsS --retry 5 --retry-delay 5 https://venus-servidor.tonysantquees95.workers.dev/id/chave-publica | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!/^[A-Za-z0-9_-]{43}$/.test(j.x))process.exit(1);console.log(j.x)})')
          echo "VITE_SELO_CHAVE=$x" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm install --no-audit --no-fund
        working-directory: app
      - name: Instalar o Tauri e gerar os ícones
        run: |
          npm install -g @tauri-apps/cli@2
          cd desktop/src-tauri
          tauri icon ../app-icon.png
      - name: Gerar o instalador
        working-directory: desktop/src-tauri
        run: tauri build
        env:
          VITE_BUILD: ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: vyntem-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    needs: verificar
    permissions:
      contents: read
      id-token: write
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Chave pública do selo de licença (embutida no aplicativo)
        run: |
          x=$(curl -fsS --retry 5 --retry-delay 5 https://venus-servidor.tonysantquees95.workers.dev/id/chave-publica | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!/^[A-Za-z0-9_-]{43}$/.test(j.x))process.exit(1);console.log(j.x)})')
          echo "VITE_SELO_CHAVE=$x" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install --no-audit --no-fund
        working-directory: app
      - name: Preparar o projeto Android
        working-directory: app
        run: |
          npm run build
          npx cap add android
          # a versão do app passa a ser a do build (1.<número>), para o app comparar com a última publicada
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/; s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep -n "versionName\|versionCode" android/app/build.gradle
          D=android/app/src/main/java/tech/vetorial/vyntem
          mkdir -p $D
          cp ../android/src/*.java $D/
          # permissões: câmera (foto da nota, pedida só ao tocar), rede e instalar a própria atualização
          PERMS='<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />'
          sed -i "s#<application#$PERMS\n    <application#" android/app/src/main/AndroidManifest.xml
          grep -c "uses-permission" android/app/src/main/AndroidManifest.xml
          # instalar a atualização baixada: o Capacitor já declara o FileProvider ".fileprovider"; aqui liberamos a pasta de cache (atualização) e as pastas de fotos (câmera)
          grep -q 'fileprovider' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<paths xmlns:android="http://schemas.android.com/apk/res/android">' '    <cache-path name="cache" path="." />' '    <external-files-path name="fotos" path="." />' '    <external-path name="externo" path="." />' '    <files-path name="arquivos" path="." />' '</paths>' > android/app/src/main/res/xml/file_paths.xml
          npx capacitor-assets generate --android --iconBackgroundColor '#170B2E' --iconBackgroundColorDark '#170B2E' --splashBackgroundColor '#05030B' --splashBackgroundColorDark '#05030B'
          npx cap sync android
        env:
          VITE_BUILD: ${{ github.run_number }}
      - name: Compilar o APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      # A chave de assinatura fica guardada (cifrada) no servidor da Vênus: cada versão instala por cima da anterior.
      - name: Assinar o APK
        run: bash .github/assinar-apk.sh app/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vyntem-android
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publicar:
    needs: [windows, android]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vyntem-windows
          path: pacote
      - uses: actions/download-artifact@v4
        with:
          name: vyntem-android
          path: pacote
      - name: Publicar a versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp pacote/app-debug.apk pacote/Vyntem.apk
          cp "$(ls pacote/*.exe | head -n 1)" pacote/VyntemSetup.exe
          gh release create "1.${{ github.run_number }}" pacote/Vyntem.apk pacote/VyntemSetup.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Vyntem 1.${{ github.run_number }}" --notes "Vyntem.apk (Android) e VyntemSetup.exe (Windows)."
